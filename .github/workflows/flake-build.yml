name: Build Nix Flake

# Full builds of the Linux home-manager configurations. CI is the only thing
# that regularly builds these (the macOS configs get built locally on every
# `nh darwin switch`, so they're only evaluated, in flake-tests.yml).
#
# - PRs that change inputs: x86_64-linux only.
# - Weekly on main: x86_64-linux and aarch64-linux. The aarch64 runner is slow
#   mostly because it compiles packages Hydra hasn't cached yet, so it isn't
#   worth blocking PRs on. The scheduled run also saves a main-scoped Nix
#   store cache, which is the only scope PR runs can restore from.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/flake-build.yml'
  schedule:
    - cron: '0 7 * * 1' # Mondays
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.machine }}
    runs-on: ${{ matrix.machine }}

    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # nix-quick-install-action is used instead of the Determinate installer
      # because cache-nix-action can only snapshot a store owned by the runner
      # user (single-user install).
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G

      - name: Check Flake
        run: nix flake check
