name: Evaluate Nix Flake

# Eval-only check of every configuration (darwin included) from one Linux
# runner: catches typos, removed options, and missing packages in ~1-2 minutes
# without building anything. Full builds live in flake-build.yml and only run
# when inputs change. The nvim plugin lockfile is excluded because it can't
# affect evaluation.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'config/**'
      - '!config/nvim/lazy-lock.json'
      - 'home-manager/**'
      - 'nix-darwin/**'
      - 'secrets/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/flake-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluate all systems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          # access-tokens avoids api.github.com's anonymous rate limit when
          # resolving flake inputs.
          nix_conf: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}

      - name: Check Flake (eval only)
        run: nix flake check --all-systems --no-build
