name: Secret Scan

# This repo is public and jj auto-tracks new files into the working copy, so a
# stray plaintext credential is one `jj git push` from disclosure. Scan full
# history with gitleaks on every push/PR. False positives are allowlisted in
# .gitleaks.toml (auto-loaded from the repo root).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so leaks in past commits are caught, not just the diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
